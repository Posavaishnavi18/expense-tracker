<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · Expense Tracker</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth">
<main class="card auth-card">
  <h1>💰 Expense Tracker</h1>
  <p class="muted">Log in to your account</p>
  <form id="form">
    <label>Email<input type="email" id="email" required autocomplete="email"></label>
    <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
    <p id="msg" class="msg" role="alert"></p>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="register.html">Create an account</a></p>
</main>
<script src="js/api.js"></script>
<script>
  api('api/auth/me').then(() => location.replace('dashboard.html')).catch(() => {});
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      await api('api/auth/login', 'POST', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      location.href = 'dashboard.html';
    } catch (err) { msg.textContent = err.message; }
  });
</script>
</body></html>
